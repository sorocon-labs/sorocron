[package]
name = "sorocron-registry"
description = "SoroCron registry: scheduled and conditional job execution by staked keepers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
sorocron-executor = { path = "../executor" }
sorocron-ttl-guardian = { path = "../ttl-guardian" }
proptest = { workspace = true }
