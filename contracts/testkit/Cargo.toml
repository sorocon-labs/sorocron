version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
sorocron-registry = { path = "../registry" }
sorocron-executor = { path = "../executor" }
