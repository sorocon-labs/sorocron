[package]
name = "sorocron-example-nft-floor-trigger"
description = "SoroCron example: Resolver that fires when an NFT collection's floor price drops below a threshold"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
sorocron-testkit = { path = "../../testkit" }
