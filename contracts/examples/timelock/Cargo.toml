[package]
name = "sorocron-example-timelock"
description = "SoroCron example: DAO timelock whose queued calls a keeper executes once their ETA passes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
sorocron-testkit = { path = "../../testkit" }
