[package]
name = "sorocron-example-timelock-resolver"
description = "SoroCron example: Resolver that opens a job only inside a governance proposal's execution window"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
sorocron-testkit = { path = "../../testkit" }
