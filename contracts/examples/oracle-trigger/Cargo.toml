[package]
name = "sorocron-example-oracle-trigger"
description = "Example SoroCron resolver: Price and health-factor threshold trigger"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib"]
