[package]
name = "sorocron-executor"
description = "SoroCron executor: fund-less contract that performs job target calls"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib"]
