[package]
name = "sorocron-ttl-guardian"
description = "SoroCron TTL Guardian: keeps contracts from being archived via scheduled TTL extension"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
