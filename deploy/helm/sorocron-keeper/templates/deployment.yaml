apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: sorocron-keeper
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # One keeper per key: replicas sharing a key race for sequence numbers.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sorocron-keeper
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: keeper
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: STELLAR_NETWORK, value: {{ .Values.network | quote }} }
            - { name: STELLAR_RPC_URL, value: {{ .Values.rpcUrl | quote }} }
            {{- with .Values.registry }}
            - { name: SOROCRON_CONTRACT_ID, value: {{ . | quote }} }
            {{- end }}
            - { name: POLL_INTERVAL_MS, value: {{ .Values.keeper.pollIntervalMs | quote }} }
            - { name: BATCH_SIZE, value: {{ .Values.keeper.batchSize | quote }} }
            - { name: FEE_PERCENTILE, value: {{ .Values.keeper.feePercentile | quote }} }
            - { name: MAX_INCLUSION_FEE, value: {{ .Values.keeper.maxInclusionFee | quote }} }
            - { name: MIN_BALANCE_XLM, value: {{ .Values.keeper.minBalanceXlm | quote }} }
            - { name: MIN_PROFIT_STROOPS, value: {{ .Values.keeper.minProfitStroops | quote }} }
            - { name: ALERT_FORMAT, value: {{ .Values.keeper.alertFormat | quote }} }
            - { name: ALERT_COOLDOWN_MS, value: {{ .Values.keeper.alertCooldownMs | quote }} }
            - { name: METRICS_PORT, value: {{ .Values.metrics.port | quote }} }
            - { name: LOG_FORMAT, value: json }
          envFrom:
            - secretRef: { name: {{ .Values.existingSecret }} }
          ports:
            - { name: metrics, containerPort: {{ .Values.metrics.port }} }
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
