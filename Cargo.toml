[workspace]
resolver = "2"
members = [
    "contracts/registry",
    "contracts/executor",
    "contracts/ttl-guardian",
    "contracts/examples/counter",
    "contracts/examples/flag-resolver",
    "contracts/examples/dca",
    "contracts/examples/vesting",
    "contracts/examples/subscription",
    "contracts/examples/oracle-trigger",
]

[workspace.package]
version = "0.1.0"  # workspace version
edition = "2021"
license = "MIT"
repository = "https://github.com/sorocon-labs/sorocron"

[workspace.dependencies]
soroban-sdk = "27.0.6"
proptest = "1.9"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
