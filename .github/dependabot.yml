version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      soroban:
        patterns: ["soroban-*"]

  - package-ecosystem: npm
    directory: /keeper-bot
    schedule:
      interval: weekly
    groups:
      stellar:
        patterns: ["@stellar/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
