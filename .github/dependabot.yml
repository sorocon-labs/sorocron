version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      soroban:
        patterns: ["soroban-*"]

  # One lockfile for the SDK, React hooks, keeper and app (npm workspaces).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      stellar:
        patterns: ["@stellar/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
