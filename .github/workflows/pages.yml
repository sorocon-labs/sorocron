name: Deploy web app

# Publishes app/ to GitHub Pages. One-time setup: Settings -> Pages ->
# Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["app/**", "packages/sdk/**", "package-lock.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build -w sorocron-app
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
