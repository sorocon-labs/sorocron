name: Deploy site

# Publishes the dashboard (app/) at the site root and the documentation book
# (book/, issue #55) under /docs/ on every push to main. One-time setup:
# Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build -w sorocron-app
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - name: Build the documentation
        run: |
          node scripts/prepare-book.mjs
          mdbook build book
          cp -r book/build app/dist/docs
        env:
          MDBOOK_OUTPUT__HTML__SITE_URL: /${{ github.event.repository.name }}/docs/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v5
