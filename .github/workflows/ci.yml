name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts (fmt, clippy, test, wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Fuzz schedule and fee math (issue #77)
        # Property tests over the registry's pure schedule calculations:
        # u64 timestamp edges, zero intervals, extreme fees. `cargo test`
        # above runs them with the default 256 cases; this pass raises the
        # case count for the PR gate.
        run: cargo test -p sorocron-registry proptest
        env:
          PROPTEST_CASES: 2048
      - run: cargo build --release --target wasm32v1-none
      - name: Enforce WASM size budget
        # Soroban rejects contracts over 64 KB; fail early with headroom.
        run: |
          budget=60000
          for f in target/wasm32v1-none/release/*.wasm; do
            size=$(stat -c%s "$f")
            echo "$(basename "$f"): $size bytes"
            if [ "$size" -gt "$budget" ]; then
              echo "::error file=$f::$(basename "$f") is $size bytes, over the $budget byte budget"
              exit 1
            fi
          done

  keeper-bot:
    name: Keeper bot (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeper-bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: keeper-bot/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
