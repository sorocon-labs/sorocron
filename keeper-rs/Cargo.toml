[package]
name = "sorocron-keeper"
description = "SoroCron keeper node in Rust: polls the registry and executes due jobs for fees"
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sorocon-labs/sorocron"
publish = false

# A standalone workspace: the keeper's RPC and async dependencies stay out of
# the contracts' build.
[workspace]

[dependencies]
stellar-rpc-client = "28.0.0"
stellar-xdr = { version = "28.0.0", features = ["std", "base64"] }
stellar-strkey = "0.0.18"
ed25519-dalek = "2.2"
sha2 = "0.10"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
